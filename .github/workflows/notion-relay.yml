name: notion-relay

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/notion-backup-af9e
    paths:
      - 'relay/**'
      - '.github/workflows/notion-relay.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: relay
      - name: Notion の秘密があれば Worker に入れる
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "${NOTION_TOKEN}" ]; then
            echo "NOTION_TOKEN is unset; Worker secret left unchanged."
            exit 0
          fi
          printf '%s\n' "${NOTION_TOKEN}" | npx --yes wrangler@3 secret put NOTION_TOKEN
